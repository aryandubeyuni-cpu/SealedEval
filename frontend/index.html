<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SealedEval</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>SealedEval</h1>
    <span id="backend-status" class="status status-pending">Checking backend…</span>
  </header>

  <main class="grid">
    <section id="run-controls" class="panel">
      <h2>Run controls</h2>
      <div class="panel-body"></div>
    </section>

    <section id="preflight" class="panel">
      <h2>Pre-flight</h2>
      <div class="panel-body"></div>
    </section>

    <section id="live-log" class="panel">
      <h2>Live log</h2>
      <div class="panel-body"></div>
    </section>

    <section id="results" class="panel">
      <h2>Results</h2>
      <div class="panel-body"></div>
    </section>

    <section id="evidence" class="panel">
      <h2>Evidence</h2>
      <div class="panel-body"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
